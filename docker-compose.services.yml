      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5102"
      ASPNETCORE_HTTP_PORT: 5102
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=vehicle_service_db;Username=postgres;Password=postgres"
      RabbitMQ__Host: "rabbitmq"
      Redis__Connection: "redis:6379"
    ports:
      - "5102:5102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grrado-network

  garage-service:
