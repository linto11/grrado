version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: grrado-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -p 5432
    networks:
      - grrado-network

  keycloak:
    image: keycloak/keycloak:latest
    container_name: grrado-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: start-dev
    networks:
      - grrado-network

  redis:
    image: redis:7-alpine
    container_name: grrado-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - grrado-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: grrado-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grrado-network

  # Microservices (placeholder for future Docker image builds)
  api-gateway:
    image: mcr.microsoft.com/dotnet/aspnet:10.0-preview
    container_name: grrado-api-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5100"
      ASPNETCORE_HTTP_PORT: 5100
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=api_gateway_db;Username=postgres;Password=postgres"
      Services__UserService: "http://user-service:5101"
      Services__VehicleService: "http://vehicle-service:5102"
      Services__GarageService: "http://garage-service:5103"
      Services__ServiceHistoryService: "http://service-history-service:5104"
      Services__ChatbotService: "http://chatbot-service:5105"
      Services__DiagnosticsService: "http://diagnostics-service:5106"
      Services__LoggingService: "http://logging-service:5107"
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grrado-network
    # To use with built images: build context ./app/server dockerfile gateway/ApiGateway/Dockerfile
    # Currently using base ASP.NET image as placeholder

  user-service:
    image: mcr.microsoft.com/dotnet/aspnet:10.0-preview
    container_name: grrado-user-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5101"
      ASPNETCORE_HTTP_PORT: 5101
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=user_service_db;Username=postgres;Password=postgres"
      RabbitMQ__Host: "rabbitmq"
      Redis__Connection: "redis:6379"
    ports:
      - "5101:5101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grrado-network

  vehicle-service:
    image: mcr.microsoft.com/dotnet/aspnet:10.0-preview
